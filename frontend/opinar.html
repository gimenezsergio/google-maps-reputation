<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reputación - Valorar Experiencia</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Custom Styles (Glassmorphism & animations) -->
    <link rel="stylesheet" href="/frontend/css/custom.css">
    <style>
        body {
            background: radial-gradient(circle at 0% 0%, #f5f7ff 0%, #eef2ff 50%, #e0e7ff 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <div id="app" class="glass-card rounded-[2.5rem] shadow-2xl shadow-indigo-100/50 w-full max-w-md overflow-hidden transition-all duration-300 transform hover:scale-[1.01]">
        
        <!-- Header con Logo del Comercio -->
        <div class="px-8 pt-8 pb-4 flex flex-col items-center border-b border-gray-100/50">
            <div class="relative mb-4">
                <!-- Circular border glow effect -->
                <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-violet-500 rounded-full blur opacity-30 animate-pulse"></div>
                <!-- Actual logo container -->
                <div class="relative bg-white h-20 w-20 rounded-full flex items-center justify-center shadow-inner overflow-hidden border border-gray-50">
                    <img id="commerce-logo" class="h-full w-full object-cover hidden" alt="Logo Comercio">
                    <div id="logo-placeholder" class="h-full w-full bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white text-3xl font-bold font-outfit">
                        <span id="logo-initial">-</span>
                    </div>
                </div>
            </div>
            <h1 id="commerce-name" class="font-outfit text-xl font-bold text-gray-800 text-center tracking-tight leading-tight">-</h1>
        </div>

        <!-- Contenedor de pantallas cargadas via main.js -->
        <div id="screen-container" class="p-8">
            <div class="flex flex-col items-center py-12">
                <div class="animate-pulse flex space-x-2">
                    <div class="h-3 w-3 bg-indigo-500 rounded-full"></div>
                    <div class="h-3 w-3 bg-indigo-500 rounded-full animation-delay-200"></div>
                    <div class="h-3 w-3 bg-indigo-500 rounded-full animation-delay-400"></div>
                </div>
                <h2 class="text-center text-sm font-medium text-gray-500 mt-6">Cargando experiencia...</h2>
            </div>
        </div>
        
    </div>

    <!-- Scripts -->
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/main.js"></script>
</body>
</html>
