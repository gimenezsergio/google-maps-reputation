<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard - Reputation Manager</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50/50 min-h-screen font-sans antialiased text-gray-800">

    <!-- Auth check script (runs instantly to prevent layout flash) -->
    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login.html';
        }
    </script>

    <!-- Navigation Header -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white font-outfit font-bold px-3 py-1.5 rounded-xl text-lg shadow-sm">RM</div>
                <span class="font-outfit font-bold text-gray-800 tracking-tight text-lg">Control de Reputación</span>
                <span class="bg-indigo-50 text-indigo-700 text-3xs font-semibold px-2 py-0.5 rounded-full uppercase tracking-wider">Super Admin</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="admin-name" class="text-xs text-gray-500 font-medium">Administrador</span>
                <button onclick="logout()" class="text-xs text-red-500 hover:text-red-600 font-semibold px-3 py-1.5 rounded-lg hover:bg-red-50 transition">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Side: Add/Edit Commerce Form Card -->
            <div class="lg:col-span-1">
                <div class="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm sticky top-24">
                    <h2 id="form-title" class="font-outfit text-lg font-bold text-gray-800 mb-6">Registrar Nuevo Comercio</h2>
                    
                    <form id="commerce-form" class="space-y-4">
                        <input type="hidden" id="edit-id">
                        
                        <div>
                            <label class="block text-2xs font-bold text-gray-400 uppercase tracking-wider mb-1">Nombre Comercial</label>
                            <input type="text" id="name" required class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none text-xs text-gray-700 placeholder-gray-300" placeholder="Ej. El Noble Gourmet">
                        </div>

                        <div>
                            <label class="block text-2xs font-bold text-gray-400 uppercase tracking-wider mb-1">Slug (URL identificadora)</label>
                            <input type="text" id="slug" required class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none text-xs text-gray-700 placeholder-gray-300" placeholder="Ej. el-noble-gourmet">
                        </div>

                        <div>
                            <label class="block text-2xs font-bold text-gray-400 uppercase tracking-wider mb-1">Google Place ID</label>
                            <input type="text" id="google-place-id" required class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none text-xs text-gray-700 placeholder-gray-300" placeholder="Ej. ChIJN1t_tDeuEmsR...">
                        </div>

                        <div>
                            <label class="block text-2xs font-bold text-gray-400 uppercase tracking-wider mb-1">URL del Logotipo</label>
                            <input type="url" id="logo-url" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none text-xs text-gray-700 placeholder-gray-300" placeholder="Ej. https://misitio.com/logo.png">
                        </div>

                        <div>
                            <label class="block text-2xs font-bold text-gray-400 uppercase tracking-wider mb-1">Etiquetas (separadas por comas)</label>
                            <input type="text" id="tags" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none text-xs text-gray-700 placeholder-gray-300" placeholder="Comida rica, Mozo amable, Poca espera">
                        </div>

                        <!-- Admin user credentials (only for creation) -->
                        <div id="credentials-section" class="border-t border-gray-100 pt-4 space-y-4">
                            <h3 class="text-xs font-semibold text-indigo-600">Credenciales del local</h3>
                            <div>
                                <label class="block text-2xs font-bold text-gray-400 uppercase tracking-wider mb-1">Usuario de Acceso</label>
                                <input type="text" id="admin-username" required class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none text-xs text-gray-700 placeholder-gray-300" placeholder="Ej. noble_admin">
                            </div>
                            <div>
                                <label class="block text-2xs font-bold text-gray-400 uppercase tracking-wider mb-1">Contraseña de Acceso</label>
                                <input type="password" id="admin-password" required class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none text-xs text-gray-700 placeholder-gray-300" placeholder="Ingresa contraseña">
                            </div>
                        </div>

                        <div id="status-section" class="hidden border-t border-gray-100 pt-4 flex items-center space-x-2">
                            <input type="checkbox" id="is-active" checked class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                            <label for="is-active" class="text-xs font-semibold text-gray-600">Comercio Activo</label>
                        </div>

                        <div class="flex space-x-2 pt-2">
                            <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-xs transition">
                                Guardar Comercio
                            </button>
                            <button type="button" id="cancel-btn" onclick="resetForm()" class="hidden bg-gray-100 hover:bg-gray-200 text-gray-500 font-semibold py-2.5 px-4 rounded-xl text-xs transition">
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Right Side: List of Commerces -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm">
                    <h2 class="font-outfit text-lg font-bold text-gray-800 mb-6">Comercios Registrados</h2>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-gray-100 text-2xs font-bold text-gray-400 uppercase tracking-wider">
                                    <th class="py-4 pr-4">Comercio</th>
                                    <th class="py-4 px-4">Slug / ID URL</th>
                                    <th class="py-4 px-4">Google Link</th>
                                    <th class="py-4 px-4">Estado</th>
                                    <th class="py-4 pl-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="commerces-list">
                                <!-- Loaded dynamically -->
                                <tr>
                                    <td colspan="5" class="py-8 text-center text-xs text-gray-400">Cargando comercios registrados...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="/frontend/js/api.js"></script>
    <script>
        let commerces = [];

        document.addEventListener("DOMContentLoaded", async () => {
            // Validate user role
            try {
                const user = await API.getMe(token);
                if (user.role !== 'super_admin') {
                    window.location.href = '/login.html';
                    return;
                }
                document.getElementById('admin-name').innerText = user.username;
                loadCommerces();
            } catch (e) {
                logout();
            }
        });

        async function loadCommerces() {
            try {
                commerces = await API.getCommerces(token);
                renderCommercesList();
            } catch (e) {
                alert("Error al cargar la lista de comercios: " + e.message);
            }
        }

        function renderCommercesList() {
            const tbody = document.getElementById('commerces-list');
            if (commerces.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-xs text-gray-400 italic">No hay comercios registrados en la plataforma.</td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = commerces.map(c => `
                <tr class="border-b border-gray-50/50 hover:bg-gray-50/30 text-xs">
                    <td class="py-4 pr-4 flex items-center space-x-3">
                        <div class="h-9 w-9 rounded-full bg-gray-100 border border-gray-200 overflow-hidden flex items-center justify-center">
                            ${c.logo_url ? `<img src="${c.logo_url}" class="h-full w-full object-cover">` : `<span class="font-bold text-gray-400 uppercase">${c.name.charAt(0)}</span>`}
                        </div>
                        <div>
                            <span class="font-semibold text-gray-800 block">${c.name}</span>
                            <span class="text-3xs text-gray-400">Creado: ${new Date(c.created_at).toLocaleDateString()}</span>
                        </div>
                    </td>
                    <td class="py-4 px-4 font-mono text-2xs text-indigo-600">
                        <a href="/opinar.html?slug=${c.slug}" target="_blank" class="hover:underline">${c.slug} ↗</a>
                    </td>
                    <td class="py-4 px-4 text-2xs text-gray-400">
                        <a href="https://search.google.com/local/writereview?placeid=${c.google_place_id}" target="_blank" class="hover:underline text-blue-500 font-medium">Ver Maps ↗</a>
                    </td>
                    <td class="py-4 px-4">
                        <span class="px-2.5 py-1 rounded-full text-3xs font-semibold ${c.is_active ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'}">
                            ${c.is_active ? 'Activo' : 'Inactivo'}
                        </span>
                    </td>
                    <td class="py-4 pl-4 text-right space-x-1.5">
                        <button onclick="editCommerce(${c.id})" class="text-indigo-600 hover:text-indigo-700 font-semibold px-2.5 py-1.5 rounded-lg hover:bg-indigo-50 transition text-2xs">
                            Editar
                        </button>
                        ${c.is_active ? `
                            <button onclick="deactivateCommerce(${c.id})" class="text-red-500 hover:text-red-600 font-semibold px-2.5 py-1.5 rounded-lg hover:bg-red-50 transition text-2xs">
                                Desactivar
                            </button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');
        }

        // Form Submit handler
        document.getElementById('commerce-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const editId = document.getElementById('edit-id').value;
            const name = document.getElementById('name').value;
            const slug = document.getElementById('slug').value;
            const google_place_id = document.getElementById('google-place-id').value;
            const logo_url = document.getElementById('logo-url').value || null;
            const tagsText = document.getElementById('tags').value;
            
            // Parse tags
            const tags = tagsText ? tagsText.split(',').map(t => t.trim()).filter(t => t.length > 0) : [];

            try {
                if (editId) {
                    // EDIT MODE
                    const is_active = document.getElementById('is-active').checked;
                    await API.updateCommerce(token, editId, { name, slug, logo_url, google_place_id, tags, is_active });
                    alert("Comercio actualizado con éxito");
                } else {
                    // CREATE MODE
                    const admin_username = document.getElementById('admin-username').value;
                    const admin_password = document.getElementById('admin-password').value;
                    await API.createCommerce(token, { name, slug, logo_url, google_place_id, tags, admin_username, admin_password });
                    alert("Comercio y usuario administrador creados con éxito");
                }
                
                resetForm();
                loadCommerces();
            } catch (err) {
                alert("Error: " + err.message);
            }
        });

        function editCommerce(id) {
            const c = commerces.find(item => item.id === id);
            if (!c) return;

            document.getElementById('edit-id').value = c.id;
            document.getElementById('name').value = c.name;
            document.getElementById('slug').value = c.slug;
            document.getElementById('google-place-id').value = c.google_place_id;
            document.getElementById('logo-url').value = c.logo_url || '';
            document.getElementById('tags').value = c.tags ? c.tags.join(', ') : '';

            // Hide admin credentials (edit route doesn't update password)
            document.getElementById('credentials-section').classList.add('hidden');
            document.getElementById('admin-username').required = false;
            document.getElementById('admin-password').required = false;

            // Show active status checkbox
            document.getElementById('status-section').classList.remove('hidden');
            document.getElementById('is-active').checked = c.is_active;

            // Update title and show cancel button
            document.getElementById('form-title').innerText = "Editar Comercio";
            document.getElementById('cancel-btn').classList.remove('hidden');
        }

        async function deactivateCommerce(id) {
            if (!confirm("¿Estás seguro de que deseas desactivar este comercio?")) return;
            try {
                await API.deleteCommerce(token, id);
                alert("Comercio desactivado con éxito");
                loadCommerces();
            } catch (e) {
                alert("Error al desactivar: " + e.message);
            }
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('name').value = '';
            document.getElementById('slug').value = '';
            document.getElementById('google-place-id').value = '';
            document.getElementById('logo-url').value = '';
            document.getElementById('tags').value = '';
            
            // Show admin credentials again
            document.getElementById('credentials-section').classList.remove('hidden');
            document.getElementById('admin-username').required = true;
            document.getElementById('admin-password').required = true;
            document.getElementById('admin-username').value = '';
            document.getElementById('admin-password').value = '';

            // Hide active status checkbox
            document.getElementById('status-section').classList.add('hidden');

            // Reset title and hide cancel button
            document.getElementById('form-title').innerText = "Registrar Nuevo Comercio";
            document.getElementById('cancel-btn').classList.add('hidden');
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
